# Deploys the Strava broker, so you never need a terminal to do it.
#
# wrangler is a Node command-line tool and there is no Node on iOS, which would
# otherwise make the worker undeployable from a phone. GitHub has Node, so it
# runs wrangler on your behalf: you edit files and set secrets in the browser,
# and this pushes the result to Cloudflare.
#
# Four repository secrets, set once at
# Settings -> Secrets and variables -> Actions -> New repository secret:
#
#   CLOUDFLARE_API_TOKEN   dash.cloudflare.com/profile/api-tokens -> Create
#                          Token -> "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the 32 hex characters in the dashboard's own URL,
#                          dash.cloudflare.com/<account id>/...
#   STRAVA_CLIENT_SECRET   from strava.com/settings/api
#   SESSION_SECRET         any long random string you invent; it signs login
#                          sessions and is not from Strava
#
# None of them are ever visible to anyone, including in this file, the logs, or
# to me. Changing SESSION_SECRET later signs everybody out, which is the point.

name: Deploy the Strava broker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the four secrets are set
        env:
          CF_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRAVA:     ${{ secrets.STRAVA_CLIENT_SECRET }}
          SESSION:    ${{ secrets.SESSION_SECRET }}
        run: |
          # A missing secret otherwise fails deep inside wrangler with a message
          # that tells you nothing. Say plainly which ones are not set yet.
          missing=""
          [ -n "$CF_TOKEN"   ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$STRAVA"     ] || missing="$missing STRAVA_CLIENT_SECRET"
          [ -n "$SESSION"    ] || missing="$missing SESSION_SECRET"
          [ -n "$missing" ] || exit 0

          {
            echo "## Not deployed yet - some secrets are missing"
            echo ""
            echo "Set these at **Settings -> Secrets and variables -> Actions"
            echo "-> New repository secret**, then re-run this from the Actions tab:"
            echo ""
            for name in $missing; do
              case "$name" in
                CLOUDFLARE_API_TOKEN)
                  echo "- \`$name\` - dash.cloudflare.com/profile/api-tokens ->"
                  echo "  Create Token -> use the **Edit Cloudflare Workers** template" ;;
                CLOUDFLARE_ACCOUNT_ID)
                  echo "- \`$name\` - the 32 hex characters in the dashboard URL"
                  echo "  itself: \`dash.cloudflare.com/<account id>/...\`" ;;
                STRAVA_CLIENT_SECRET)
                  echo "- \`$name\` - strava.com/settings/api, under *Client Secret*" ;;
                SESSION_SECRET)
                  echo "- \`$name\` - any long random string you make up. It signs"
                  echo "  login sessions; it does not come from Strava or Cloudflare." ;;
              esac
            done
            echo ""
            echo "Nothing else has run, so nothing is half-deployed."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Missing repository secrets:$missing" >&2
          exit 1

      - name: Check Cloudflare is ready
        env:
          CF_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler's failures for these three are unreadable on a phone, and
          # the fix for the first is a dashboard page whose menu label keeps
          # changing. One API call says which it is, and lets us print a link
          # with the real account id already in it.
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain"
          code=$(curl -sS -o sub.json -w '%{http_code}' --max-time 30 -H "Authorization: Bearer $CF_TOKEN" "$api" || echo 000)
          sub=$(python3 -c "import json;print((json.load(open('sub.json')).get('result') or {}).get('subdomain') or '')" 2>/dev/null || true)
          # Cloudflare's own error text beats anything I can guess from a status
          # code, so carry it into the summary verbatim.
          cferr=$(python3 -c "import json;e=(json.load(open('sub.json')).get('errors') or [{}])[0];print('%s %s' % (e.get('code',''), e.get('message','')))" 2>/dev/null || true)
          cfcode=$(python3 -c "import json;print((json.load(open('sub.json')).get('errors') or [{}])[0].get('code',''))" 2>/dev/null || true)
          say () { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          if [ "$code" = "200" ] && [ -n "$sub" ]; then
            echo "workers.dev subdomain: $sub"
            say "Deploying to \`runmon-strava.$sub.workers.dev\`"
            say ""
            exit 0
          fi

          # A brand new account answers 404 here: the subdomain resource does
          # not exist yet. That is the common case, not a bad account id.
          if [ "$code" = "200" ] || [ "$code" = "404" ]; then
            say "## Pick a workers.dev subdomain first"
            say ""
            say "Your Cloudflare account has not chosen one yet. A first deploy"
            say "stops to ask for it and this runner has nobody to ask, so it has"
            say "to be done once by hand, in the dashboard:"
            say ""
            say "**https://dash.cloudflare.com/$CF_ACCOUNT/workers-and-pages**"
            say ""
            say "That link already has your account id in it. Pick any name; it"
            say "becomes the worker's address, \`runmon-strava.<name>.workers.dev\`."
            say "Then re-run this workflow from the Actions tab."
            if [ -n "$cferr" ]; then
              say ""
              say "Cloudflare said: \`$cferr\`"
              say ""
              say "If that page shows you *already have* a subdomain, then this"
              say "is the other thing a 404 can mean and \`CLOUDFLARE_ACCOUNT_ID\`"
              say "is wrong - it is the 32 hex characters in the dashboard's own"
              say "URL, nothing else."
            fi
            say ""
            say "Nothing was deployed."
            echo "::error::no workers.dev subdomain (HTTP $code, $cferr)"
            exit 1
          fi

          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            say "## Cloudflare rejected the API token"
            say ""
            say "HTTP $code from the Workers API. Either \`CLOUDFLARE_API_TOKEN\` is"
            say "wrong or expired, or it lacks Workers permissions. Remake it at"
            say "https://dash.cloudflare.com/profile/api-tokens with the *Edit"
            say "Cloudflare Workers* template rather than by hand."
            [ -n "$cferr" ] && say "" && say "Cloudflare said: \`$cferr\`"
            say ""
            say "Nothing was deployed."
            echo "::error::Cloudflare returned $code for the token"
            exit 1
          fi

          if [ "$code" = "400" ]; then
            say "## That Account ID does not look right"
            say ""
            say "Cloudflare returned HTTP $code. \`CLOUDFLARE_ACCOUNT_ID\` is the 32"
            say "hex characters in the dashboard's own URL, not your email."
            [ -n "$cferr" ] && say "" && say "Cloudflare said: \`$cferr\`"
            say ""
            say "Nothing was deployed."
            echo "::error::Cloudflare returned $code for that account id"
            exit 1
          fi

          # Anything else is a blip, or a token that cannot read this one
          # endpoint. Not worth blocking a deploy that may well work.
          echo "::warning::could not check the workers.dev subdomain (HTTP $code); continuing"

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # each name here is pushed to the worker with `wrangler secret put`,
          # taking its value from the env block below
          secrets: |
            STRAVA_CLIENT_SECRET
            SESSION_SECRET
        env:
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Tell me the URL
        # skipped when the preflight stopped us: it already said what to do
        if: always() && steps.deploy.conclusion != 'skipped'
        run: |
          {
            if [ "${{ steps.deploy.outcome }}" = "success" ]; then
              echo "## Strava broker deployed"
            else
              echo "## The deploy failed"
            fi
            echo ""
            URL="${{ steps.deploy.outputs.deployment-url }}"
            if [ -n "$URL" ]; then
              echo "**Worker URL:** \`$URL\`"
              echo ""
              echo "Two things left, both in the browser:"
              echo ""
              echo "1. **Strava** -> strava.com/settings/api -> *Authorization Callback Domain*"
              echo "   -> \`$(echo "$URL" | sed -e 's|^https\?://||' -e 's|/.*$||')\`"
              echo "   (host only - no https://, no trailing slash)"
              echo "2. **index.html** line 1298 -> \`const RUNMON_API = \"$URL\";\`"
              echo "   (full URL, no trailing slash)"
            else
              echo "No URL was reported. The deploy step's log above says why."
              echo ""
              echo "The usual causes, in the order they bite:"
              echo ""
              echo "- **No workers.dev subdomain yet.** A brand new Cloudflare"
              echo "  account has not picked one, and this runner cannot answer"
              echo "  the prompt that asks. The step before this one normally"
              echo "  catches that and prints the exact page to fix it on."
              echo "- **The API token is missing a permission.** Make it from the"
              echo "  *Edit Cloudflare Workers* template rather than by hand."
              echo "- **A wrong Account ID.** It is the 32 hex characters in the"
              echo "  dashboard's own URL, not your email or account name."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
