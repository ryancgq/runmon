# Deploys the Strava broker, so you never need a terminal to do it.
#
# wrangler is a Node command-line tool and there is no Node on iOS, which would
# otherwise make the worker undeployable from a phone. GitHub has Node, so it
# runs wrangler on your behalf: you edit files and set secrets in the browser,
# and this pushes the result to Cloudflare.
#
# Four repository secrets, set once at
# Settings -> Secrets and variables -> Actions -> New repository secret:
#
#   CLOUDFLARE_API_TOKEN   dash.cloudflare.com/profile/api-tokens -> Create
#                          Token -> "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the 32 hex characters in the dashboard's own URL,
#                          dash.cloudflare.com/<account id>/... Better set as a
#                          repository *variable* than a secret: it is an
#                          identifier, not a credential, and as a secret GitHub
#                          redacts it from the links this workflow prints.
#   STRAVA_CLIENT_SECRET   from strava.com/settings/api
#   SESSION_SECRET         any long random string you invent; it signs login
#                          sessions and is not from Strava
#
# None of them are ever visible to anyone, including in this file, the logs, or
# to me. Changing SESSION_SECRET later signs everybody out, which is the point.

name: Deploy the Strava broker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      subdomain:
        description: "workers.dev name to claim, if the account has none yet (lowercase letters, digits, hyphens)"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the four secrets are set
        env:
          CF_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          # the same value again, but only when it is a variable - GitHub
          # redacts secrets from summaries, so a link built from the secret
          # comes out as *** and is useless to click.
          CF_ACCOUNT_SHOWABLE: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STRAVA:     ${{ secrets.STRAVA_CLIENT_SECRET }}
          SESSION:    ${{ secrets.SESSION_SECRET }}
        run: |
          # A missing secret otherwise fails deep inside wrangler with a message
          # that tells you nothing. Say plainly which ones are not set yet.
          missing=""
          [ -n "$CF_TOKEN"   ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$STRAVA"     ] || missing="$missing STRAVA_CLIENT_SECRET"
          [ -n "$SESSION"    ] || missing="$missing SESSION_SECRET"
          [ -n "$missing" ] || exit 0

          {
            echo "## Not deployed yet - some secrets are missing"
            echo ""
            echo "Set these at **Settings -> Secrets and variables -> Actions"
            echo "-> New repository secret**, then re-run this from the Actions tab:"
            echo ""
            for name in $missing; do
              case "$name" in
                CLOUDFLARE_API_TOKEN)
                  echo "- \`$name\` - dash.cloudflare.com/profile/api-tokens ->"
                  echo "  Create Token -> use the **Edit Cloudflare Workers** template" ;;
                CLOUDFLARE_ACCOUNT_ID)
                  echo "- \`$name\` - the 32 hex characters in the dashboard URL"
                  echo "  itself: \`dash.cloudflare.com/<account id>/...\`" ;;
                STRAVA_CLIENT_SECRET)
                  echo "- \`$name\` - strava.com/settings/api, under *Client Secret*" ;;
                SESSION_SECRET)
                  echo "- \`$name\` - any long random string you make up. It signs"
                  echo "  login sessions; it does not come from Strava or Cloudflare." ;;
              esac
            done
            echo ""
            echo "Nothing else has run, so nothing is half-deployed."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Missing repository secrets:$missing" >&2
          exit 1

      - name: Check Cloudflare is ready
        env:
          CF_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          # the same value again, but only when it is a variable - GitHub
          # redacts secrets from summaries, so a link built from the secret
          # comes out as *** and is useless to click.
          CF_ACCOUNT_SHOWABLE: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Cloudflare is unreachable from where this workflow was written, so
          # every dashboard path in it would be a guess - and two guesses have
          # already 404'd. This asks Cloudflare instead, and only ever prints
          # facts it got back.
          say () { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          get () { curl -sS -o "$2" -w '%{http_code}' --max-time 30 -H "Authorization: Bearer $CF_TOKEN" "$1" || echo 000; }
          jget () { python3 -c "import json,sys;d=json.load(open(sys.argv[1]));r=d.get('result') or {};print(r.get(sys.argv[2]) or '')" "$1" "$2" 2>/dev/null || true; }
          jerr () { python3 -c "import json,sys;e=(json.load(open(sys.argv[1])).get('errors') or [{}])[0];print('%s %s' % (e.get('code',''), e.get('message','')))" "$1" 2>/dev/null || true; }

          base="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT"

          # 1. Is the account id itself good? This separates "wrong id" from
          #    "nothing set up yet", which otherwise both surface as a 404.
          acode=$(get "$base" acct.json)
          aname=$(jget acct.json name)
          aerr=$(jerr acct.json)

          if [ "$acode" != "200" ]; then
            say "## Cloudflare would not accept the account or the token"
            say ""
            say "\`GET /accounts/{id}\` returned **HTTP $acode**."
            [ -n "$aerr" ] && say "" && say "Cloudflare said: \`$aerr\`"
            say ""
            case "$acode" in
              401|403) say "That is the token. Remake it at"
                       say "https://dash.cloudflare.com/profile/api-tokens with the"
                       say "*Edit Cloudflare Workers* template, leaving Client IP"
                       say "filtering and TTL empty, and update the"
                       say "\`CLOUDFLARE_API_TOKEN\` secret." ;;
              400|404) say "That is the account id. \`CLOUDFLARE_ACCOUNT_ID\` must be"
                       say "the 32 hex characters from the dashboard's own URL and"
                       say "nothing else - no https://, no /workers, no email." ;;
              *)       say "Neither reason is obvious. The raw response is in the"
                       say "step log above." ;;
            esac
            say ""
            say "Nothing was deployed."
            echo "::error::GET /accounts/{id} returned $acode"
            exit 1
          fi

          say "Cloudflare account: **$aname**"
          say ""

          # 2. Account is good, so a 404 here really does mean "no subdomain".
          scode=$(get "$base/workers/subdomain" sub.json)
          sub=$(jget sub.json subdomain)
          serr=$(jerr sub.json)

          if [ "$scode" = "200" ] && [ -n "$sub" ]; then
            echo "workers.dev subdomain: $sub"
            say "Deploying to \`runmon-strava.$sub.workers.dev\`"
            say ""
            exit 0
          fi

          # 3. No subdomain. The dashboard page that creates one has moved
          #    around enough that three different URLs 404'd, so claim it
          #    through the API instead - same thing, no navigating.
          if [ "$scode" = "200" ] || [ "$scode" = "404" ]; then
            want=$(echo "${{ inputs.subdomain }}" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9-')

            if [ -n "$want" ]; then
              pcode=$(curl -sS -o put.json -w '%{http_code}' --max-time 30 -X PUT \
                        -H "Authorization: Bearer $CF_TOKEN" \
                        -H "Content-Type: application/json" \
                        --data "{\"subdomain\":\"$want\"}" \
                        "$base/workers/subdomain" || echo 000)
              perr=$(jerr put.json)

              if [ "$pcode" = "200" ]; then
                say "Claimed the workers.dev subdomain **$want**."
                say ""
                echo "claimed subdomain: $want"
                exit 0
              fi

              say "## Could not claim \`$want\`"
              say ""
              say "Cloudflare returned **HTTP $pcode**."
              [ -n "$perr" ] && say "" && say "Cloudflare said: \`$perr\`"
              say ""
              say "workers.dev names are unique across all of Cloudflare, so a"
              say "short common word is usually taken. Run this workflow again"
              say "with something more specific in the **subdomain** box."
              say ""
              say "Nothing was deployed."
              echo "::error::could not claim subdomain $want ($pcode $perr)"
              exit 1
            fi

            say "## This account needs a workers.dev subdomain"
            say ""
            say ""
            say "Your account id and token are both fine - Cloudflare just told"
            say "us the account is **$aname**. It simply has no workers.dev"
            say "subdomain yet, and a first deploy needs one."
            [ -n "$serr" ] && say "" && say "Cloudflare said: \`$serr\`"
            say ""
            say "**Run this workflow again and type a name into the \`subdomain\`"
            say "box.** It will be claimed through Cloudflare's API, so there is"
            say "no dashboard page to find. The name becomes the worker's"
            say "address, \`runmon-strava.<name>.workers.dev\`; lowercase letters,"
            say "digits and hyphens, and unique across all of Cloudflare, so"
            say "pick something specific rather than a short common word."
            say ""
            say "Nothing was deployed."
            echo "::error::no workers.dev subdomain ($scode, $serr)"
            exit 1
          fi

          # Readable but unexpected: say so and let wrangler have its turn.
          echo "::warning::subdomain check returned HTTP $scode ($serr); continuing"
          say "Could not read the workers.dev subdomain (HTTP $scode). Trying the"
          say "deploy anyway."
          say ""

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # each name here is pushed to the worker with `wrangler secret put`,
          # taking its value from the env block below
          secrets: |
            STRAVA_CLIENT_SECRET
            SESSION_SECRET
        env:
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Tell me the URL
        # skipped when the preflight stopped us: it already said what to do
        if: always() && steps.deploy.conclusion != 'skipped'
        run: |
          {
            if [ "${{ steps.deploy.outcome }}" = "success" ]; then
              echo "## Strava broker deployed"
            else
              echo "## The deploy failed"
            fi
            echo ""
            URL="${{ steps.deploy.outputs.deployment-url }}"
            if [ -n "$URL" ]; then
              echo "**Worker URL:** \`$URL\`"
              echo ""
              echo "Two things left, both in the browser:"
              echo ""
              echo "1. **Strava** -> strava.com/settings/api -> *Authorization Callback Domain*"
              echo "   -> \`$(echo "$URL" | sed -e 's|^https\?://||' -e 's|/.*$||')\`"
              echo "   (host only - no https://, no trailing slash)"
              echo "2. **index.html** line 1298 -> \`const RUNMON_API = \"$URL\";\`"
              echo "   (full URL, no trailing slash)"
            else
              echo "No URL was reported. The deploy step's log above says why."
              echo ""
              echo "The usual causes, in the order they bite:"
              echo ""
              echo "- **No workers.dev subdomain yet.** A brand new Cloudflare"
              echo "  account has not picked one, and this runner cannot answer"
              echo "  the prompt that asks. The step before this one normally"
              echo "  catches that and prints the exact page to fix it on."
              echo "- **The API token is missing a permission.** Make it from the"
              echo "  *Edit Cloudflare Workers* template rather than by hand."
              echo "- **A wrong Account ID.** It is the 32 hex characters in the"
              echo "  dashboard's own URL, not your email or account name."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
